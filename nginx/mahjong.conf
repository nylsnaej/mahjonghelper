# Copier vers /etc/nginx/sites-available/mahjong
# Puis : sudo ln -s /etc/nginx/sites-available/mahjong /etc/nginx/sites-enabled/
# Certificat SSL : sudo certbot --nginx -d mahjong.feytaud.fr

server {
    listen 80;
    server_name mahjong.feytaud.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mahjong.feytaud.fr;

    ssl_certificate     /etc/letsencrypt/live/mahjong.feytaud.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahjong.feytaud.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Vite build output
    root /opt/mahjonghelper/dist;
    index index.html;

    # En-têtes de sécurité HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long durée pour les assets Vite (noms hachés — toujours frais)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
